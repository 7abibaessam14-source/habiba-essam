# Sends the daily / weekly / monthly energy reports (send_reports.py).
# Keys: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret.
# Run it by hand: Actions tab -> Energy reports -> Run workflow (tick "force" to send to everyone now).
name: Energy reports

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC = 20:00 in Cairo in winter, 21:00 in summer (GitHub can start a few minutes late)
  workflow_dispatch:
    inputs:
      force:
        description: "Send to everyone now (ignore Daily / Weekly / Monthly)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python send_reports.py ${{ inputs.force && '--force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REPORT_SUBSCRIBERS: ${{ secrets.REPORT_SUBSCRIBERS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
